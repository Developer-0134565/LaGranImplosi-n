name: Supabase backup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check backup secret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not configured."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create backup directory
        run: mkdir -p backup/supabase

      - name: Backup roles
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/supabase/roles.sql --role-only

      - name: Backup schema
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/supabase/schema.sql

      - name: Backup data
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/supabase/data.sql --data-only --use-copy

      - name: Create manifest
        run: |
          cat > backup/supabase/README.txt <<'EOF'
          La Gran Implosion - Supabase logical backup

          roles.sql  = database roles
          schema.sql = database schema
          data.sql   = database data

          Generated by GitHub Actions.
          Do not commit these files to the repository: they may contain production data.
          EOF
          date -u +%Y-%m-%dT%H:%M:%SZ > backup/supabase/created_at.txt

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_number }}
          path: backup/supabase/
          retention-days: 90
          if-no-files-found: error
