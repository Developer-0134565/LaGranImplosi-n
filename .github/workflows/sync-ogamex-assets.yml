name: Sync OGameX visual reference assets

on:
  push:
    branches:
      - fix/ui-designer-template-authority

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Populate OGameX reference assets
        run: node scripts/fetch-ogamex-assets.mjs

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/ogamex/objects
          if git diff --cached --quiet; then
            echo "No OGameX asset changes."
            exit 0
          fi
          git commit -m "chore(ui): import OGameX visual reference assets"
          git push
